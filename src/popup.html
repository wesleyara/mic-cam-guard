<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18h.01"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
  <symbol id="i-mic-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M9 9v2a3 3 0 005 2.2M15 9.3V6a3 3 0 00-5.6-1.5M5 11a7 7 0 0011 5.7M19 11a7 7 0 01-.6 2.8M12 18v3"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3"/></symbol>
  <symbol id="i-video-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M15 15v1a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h2m4 0h2a2 2 0 012 2v3l6-3v10"/></symbol>
  <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></symbol>
  <symbol id="i-door" viewBox="0 0 24 24"><path d="M14 4h5v16h-5M4 12h10M10 8l4 4-4 4"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0112 0v6l2 2H4l2-2zM10 21h4"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0114 0M16 4.5a3.5 3.5 0 010 7M18 14a7 7 0 013 6"/></symbol>
</defs></svg>

  <header class="hero" id="hero">
    <div class="logo"><svg class="ico"><use href="#i-shield"/></svg></div>
    <div class="grow">
      <h1>MicCam Guard</h1>
      <div class="sub"><span class="pulse"></span><span id="headSub">Protection is active</span></div>
    </div>
    <input type="checkbox" class="switch on-hero" data-key="enabled" aria-label="Enable" data-i18n-aria="p_enable">
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="home" data-i18n="p_tabHome">Home</button>
    <button role="tab" data-tab="rules" data-i18n="p_tabRules">Protections</button>
    <button role="tab" data-tab="settings" data-i18n="p_tabSettings">Settings</button>
  </nav>

  <!-- ===== Início ===== -->
  <main data-panel="home">
    <section class="card">
      <div class="status">
        <b id="stSite" class="site">—</b>
        <span class="pills"><span class="pill" id="stMic" data-base="pill"></span><span class="pill" id="stCam" data-base="pill"></span></span>
      </div>
      <div class="meter"><div class="bar"></div><div class="mark"></div></div>
      <div class="level-row"><span class="testBadge chip none" data-i18n="p_joinCall">Join a call</span><span id="stSilent" class="muted"></span></div>
      <label class="slider"><span data-i18n="p_sensitivity">Sensitivity</span><input type="range" data-key="threshold" min="0.002" max="0.1" step="0.001"><b class="thrVal"></b></label>
      <div class="chips-h" id="chipsTitle" data-i18n="p_activeProt">Active protections</div>
      <div class="chips" id="chips"></div>
    </section>

    <section class="card">
      <label class="row"><span class="tile violet"><svg class="ico"><use href="#i-sliders"/></svg></span><span class="lbl" data-i18n="p_profiles">Profiles</span><select id="presetSel"></select></label>
    </section>

    <button class="panic" id="panicBtn"><svg class="ico"><use href="#i-alert"/></svg><span data-i18n="p_panicBtn">Panic: mute everything</span></button>
    <div class="hint center" id="panicHint"></div>
  </main>

  <!-- ===== Proteções ===== -->
  <main data-panel="rules" hidden>
    <section class="card">
      <div class="row scope">
        <span data-i18n="p_scope">Rules for</span>
        <span class="inline"><select id="scopeSel"></select><button class="icon-btn" id="scopeReset" hidden data-i18n-title="p_scopeReset" data-i18n-aria="p_scopeReset"><svg class="ico"><use href="#i-repeat"/></svg></button></span>
      </div>
      <label class="row" data-i18n-title="p_autoMuteD"><span class="tile blue"><svg class="ico"><use href="#i-timer"/></svg></span><span class="lbl" data-i18n="p_autoMute">Auto Mute</span><input type="checkbox" class="switch" data-key="autoMute"></label>
      <label class="row" data-i18n-title="p_muteJoinD"><span class="tile blue"><svg class="ico"><use href="#i-door"/></svg></span><span class="lbl" data-i18n="p_muteJoin">Mute on Join</span><input type="checkbox" class="switch" data-key="muteOnJoin"></label>
      <label class="row" data-i18n-title="p_camJoinD"><span class="tile violet"><svg class="ico"><use href="#i-video-off"/></svg></span><span class="lbl" data-i18n="p_camJoin">Auto Camera Off</span><input type="checkbox" class="switch" data-key="cameraOffOnJoin"></label>
      <label class="row" data-i18n-title="p_confUnmuteD"><span class="tile amber"><svg class="ico"><use href="#i-mic"/></svg></span><span class="lbl" data-i18n="p_confUnmute">Confirm Before Unmute</span><input type="checkbox" class="switch" data-key="confirmUnmute"></label>
      <label class="row" data-i18n-title="p_confCamD"><span class="tile amber"><svg class="ico"><use href="#i-video"/></svg></span><span class="lbl" data-i18n="p_confCam">Confirm Before Camera</span><input type="checkbox" class="switch" data-key="confirmCamera"></label>
      <label class="row" data-i18n-title="p_mutedTalkD"><span class="tile green"><svg class="ico"><use href="#i-mic-off"/></svg></span><span class="lbl" data-i18n="p_mutedTalk">Talking While Muted</span><input type="checkbox" class="switch" data-key="mutedTalkWarning"></label>
      <label class="row" data-i18n-title="p_deviceChangeD"><span class="tile green"><svg class="ico"><use href="#i-bell"/></svg></span><span class="lbl" data-i18n="p_deviceChange">Device Change Warning</span><input type="checkbox" class="switch" data-key="deviceChangeWarning"></label>
      <label class="row" data-i18n-title="p_warnCloseD"><span class="tile green"><svg class="ico"><use href="#i-alert"/></svg></span><span class="lbl" data-i18n="p_warnClose">Warn Before Close</span><input type="checkbox" class="switch" data-key="warnBeforeClose"></label>

      <button class="more" id="moreBtn" aria-expanded="false"><span data-i18n="p_moreOpts">More options</span><svg class="ico chev"><use href="#i-chev"/></svg></button>
      <div id="more" hidden>
        <label class="row" data-i18n-title="p_forceMuteD"><span class="tile rose"><svg class="ico"><use href="#i-lock"/></svg></span><span class="lbl" data-i18n="p_forceMute">Always Force Mute</span><input type="checkbox" class="switch" data-key="forceMute"></label>
        <label class="row" data-i18n-title="p_forceCamD"><span class="tile rose"><svg class="ico"><use href="#i-lock"/></svg></span><span class="lbl" data-i18n="p_forceCam">Always Force Camera Off</span><input type="checkbox" class="switch" data-key="forceCameraOff"></label>
      </div>
    </section>
  </main>

  <!-- ===== Ajustes ===== -->
  <main data-panel="settings" hidden>
    <details class="card">
      <summary><svg class="ico"><use href="#i-mic"/></svg><span data-i18n="p_secAudio">Silence &amp; audio</span><svg class="ico chev"><use href="#i-chev"/></svg></summary>
      <label class="row" data-i18n-title="p_micDeviceHint"><span class="tile gray"><svg class="ico"><use href="#i-mic"/></svg></span><span class="lbl" data-i18n="p_micDevice">Microphone</span><select id="micDevice" data-key="micDeviceId"></select></label>
      <label class="row"><span class="tile gray"><svg class="ico"><use href="#i-timer"/></svg></span><span class="lbl" data-i18n="p_warnAfter">Warn after silence (s)</span><input type="number" data-key="silenceSeconds" data-min="5" min="5" max="600"></label>
      <label class="row"><span class="tile gray"><svg class="ico"><use href="#i-repeat"/></svg></span><span class="lbl" data-i18n="p_repeatEvery">Repeat every (s)</span><input type="number" data-key="repeatSeconds" data-min="5" min="5" max="600"></label>
      <label class="row"><span class="tile gray"><svg class="ico"><use href="#i-mic-off"/></svg></span><span class="lbl" data-i18n="p_autoMuteAfter">Auto Mute after (s)</span><input type="number" data-key="autoMuteSeconds" data-min="10" min="10" max="1800"></label>
      <label class="row" data-i18n-title="p_nativeNotifD"><span class="tile gray"><svg class="ico"><use href="#i-bell"/></svg></span><span class="lbl" data-i18n="p_nativeNotif">Native notification</span><input type="checkbox" class="switch" data-key="nativeNotification"></label>
      <button class="more" id="notifyTestBtn" data-i18n="p_notifyTest">Send test notification</button>
      <div class="hint" id="notifyHint" role="status"></div>
    </details>

    <details class="card">
      <summary><svg class="ico"><use href="#i-clock"/></svg><span data-i18n="p_schedule">Schedule</span><svg class="ico chev"><use href="#i-chev"/></svg></summary>
      <label class="row" data-i18n-title="p_scheduleOnD"><span class="tile gray"><svg class="ico"><use href="#i-clock"/></svg></span><span class="lbl" data-i18n="p_scheduleOn">Enable schedule</span><input type="checkbox" class="switch" data-key="scheduleEnabled"></label>
      <div class="row range"><span class="tile gray"><svg class="ico"><use href="#i-clock"/></svg></span><span class="inline"><input type="time" data-key="scheduleStart" data-i18n-aria="p_scheduleFrom" aria-label="From"><span class="muted" data-i18n="p_scheduleTo">To</span><input type="time" data-key="scheduleEnd" data-i18n-aria="p_scheduleTo" aria-label="To"></span></div>
      <label class="row"><span class="tile gray"><svg class="ico"><use href="#i-door"/></svg></span><span class="lbl" data-i18n="p_scheduleWeekdays">Weekdays only</span><input type="checkbox" class="switch" data-key="scheduleWeekdays"></label>
      <label class="row"><span class="tile gray"><svg class="ico"><use href="#i-sliders"/></svg></span><span class="lbl" data-i18n="p_scheduleProfile">Profile in window</span><select id="scheduleProfile" data-key="scheduleProfile"></select></label>
    </details>

    <details class="card">
      <summary><svg class="ico"><use href="#i-globe"/></svg><span data-i18n="p_platforms">Platforms</span><svg class="ico chev"><use href="#i-chev"/></svg></summary>
      <div id="platforms"></div>
    </details>

    <details class="card">
      <summary><svg class="ico"><use href="#i-chart"/></svg><span data-i18n="p_secData">Data</span><svg class="ico chev"><use href="#i-chev"/></svg></summary>
      <div class="stats">
        <div><b id="stAuto">0</b><span data-i18n="p_statAuto">Auto-mutes</span></div>
        <div><b id="stBlocked">0</b><span data-i18n="p_statBlocked">Accidents prevented</span></div>
        <div><b id="stTalk">0</b><span data-i18n="p_statTalk">Talking-while-muted alerts</span></div>
        <div><b id="stPanic">0</b><span data-i18n="p_statPanic">Panic uses</span></div>
      </div>
      <div class="hint" id="statsSince"></div>
      <div class="btnrow">
        <button class="more" id="statsReset" data-i18n="p_statsReset">Reset counters</button>
        <button class="more" id="exportBtn" data-i18n="p_export">Export settings</button>
        <button class="more" id="importBtn" data-i18n="p_import">Import settings</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <div class="hint" id="backupHint"></div>
    </details>

    <div class="card">
      <label class="row"><span class="tile gray"><svg class="ico"><use href="#i-globe"/></svg></span><span class="lbl" data-i18n="p_language">Language</span><select id="langSel"></select></label>
    </div>

    <div class="theme">
      <span data-i18n="p_theme">Theme</span>
      <div class="seg" id="theme">
        <button data-theme="light" data-i18n-title="p_light" data-i18n-aria="p_light"><svg class="ico"><use href="#i-sun"/></svg></button>
        <button data-theme="dark" data-i18n-title="p_dark" data-i18n-aria="p_dark"><svg class="ico"><use href="#i-moon"/></svg></button>
        <button data-theme="system" data-i18n-title="p_system" data-i18n-aria="p_system"><svg class="ico"><use href="#i-monitor"/></svg></button>
      </div>
    </div>
  </main>

  <script src="messages.js"></script>
  <script src="defaults.js"></script>
  <script src="platforms.js"></script>
  <script src="popup.js"></script>
</body>
</html>
